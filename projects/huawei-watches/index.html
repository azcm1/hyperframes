<!doctype html>
<html lang="ar" dir="rtl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        background: #000;
      }
      #cam {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #push {
        position: absolute;
        inset: 0;
        transform-origin: 50% 46%;
      }
      #a-roll,
      #d3-pull {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="88.6"
      data-width="1080"
      data-height="1920"
    >
      <div id="cam" data-layout-allow-overflow>
        <div id="push">
          <video
            id="a-roll"
            class="clip"
            src="assets/aroll.mp4"
            playsinline
            data-start="0"
            data-duration="88.6"
            data-track-index="0"
            data-has-audio="true"
          ></video>
          <!-- the D3 airbag shot pulled forward to 2.8 s so it is on screen when the VO says «تنتفخ»;
               slowed to 0.743x so its 5 s fill 2.8 -> 9.53 without repeating any frames -->
          <video
            id="d3-pull"
            class="clip"
            src="assets/aroll.mp4"
            playsinline
            muted
            data-start="2.8"
            data-duration="6.73"
            data-media-start="4.53"
            data-playback-rate="0.743"
            data-track-index="6"
          ></video>
        </div>
      </div>

      <!-- motion graphics, one scene per chapter -->
      <div id="hook" class="scene" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="13.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="kids" class="scene" data-composition-id="kids" data-composition-src="compositions/kids.html"
        data-start="13.5" data-duration="28.8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="d3" class="scene" data-composition-id="d3" data-composition-src="compositions/d3.html"
        data-start="42.3" data-duration="22.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="gt7" class="scene" data-composition-id="gt7" data-composition-src="compositions/gt7.html"
        data-start="64.9" data-duration="14.9" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="outro" class="scene" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="79.8" data-duration="8.8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <!-- captions rail -->
      <div id="captions" class="scene" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="88.6" data-track-index="2" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 3"></div>

      <!-- sound on the visible actions -->
      <audio id="sfx-shutter" class="clip" src="assets/sfx/click.mp3" data-start="0.95" data-duration="0.36" data-track-index="3" data-volume="0.55"></audio>
      <audio id="sfx-inflate" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.8" data-duration="0.57" data-track-index="3" data-volume="0.45"></audio>
      <audio id="sfx-q" class="clip" src="assets/sfx/pop.mp3" data-start="4.55" data-duration="0.72" data-track-index="3" data-volume="0.35"></audio>
      <audio id="sfx-brand" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="7.4" data-duration="0.57" data-track-index="3" data-volume="0.4"></audio>
      <audio id="sfx-tag1" class="clip" src="assets/sfx/pop.mp3" data-start="10.3" data-duration="0.72" data-track-index="3" data-volume="0.3"></audio>
      <audio id="sfx-tag2" class="clip" src="assets/sfx/pop.mp3" data-start="10.75" data-duration="0.72" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-tag3" class="clip" src="assets/sfx/pop.mp3" data-start="11.2" data-duration="0.72" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-ch1" class="clip" src="assets/sfx/whoosh.mp3" data-start="13.55" data-duration="0.57" data-track-index="3" data-volume="0.45"></audio>
      <audio id="sfx-cam" class="clip" src="assets/sfx/click.mp3" data-start="21.0" data-duration="0.36" data-track-index="3" data-volume="0.5"></audio>
      <audio id="sfx-sim" class="clip" src="assets/sfx/pop.mp3" data-start="22.6" data-duration="0.72" data-track-index="3" data-volume="0.3"></audio>
      <audio id="sfx-video" class="clip" src="assets/sfx/pop.mp3" data-start="25.05" data-duration="0.72" data-track-index="3" data-volume="0.3"></audio>
      <audio id="sfx-alert" class="clip" src="assets/sfx/notification.mp3" data-start="31.8" data-duration="1.6" data-track-index="3" data-volume="0.45"></audio>
      <audio id="sfx-link" class="clip" src="assets/sfx/ping.mp3" data-start="37.65" data-duration="1.3" data-track-index="3" data-volume="0.35"></audio>
      <audio id="sfx-ch2" class="clip" src="assets/sfx/whoosh.mp3" data-start="43.7" data-duration="0.57" data-track-index="3" data-volume="0.45"></audio>
      <audio id="sfx-badge" class="clip" src="assets/sfx/ping.mp3" data-start="46.2" data-duration="1.3" data-track-index="3" data-volume="0.3"></audio>
      <audio id="sfx-100" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="53.45" data-duration="2.1" data-track-index="3" data-volume="0.35"></audio>
      <audio id="sfx-ch3" class="clip" src="assets/sfx/whoosh.mp3" data-start="64.95" data-duration="0.57" data-track-index="3" data-volume="0.45"></audio>
      <audio id="sfx-sparkle" class="clip" src="assets/sfx/sparkle.mp3" data-start="69.75" data-duration="1.8" data-track-index="3" data-volume="0.35"></audio>
      <audio id="sfx-ready" class="clip" src="assets/sfx/ping.mp3" data-start="74.2" data-duration="1.3" data-track-index="3" data-volume="0.3"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="77.6" data-duration="2.9" data-track-index="3" data-volume="0.25" data-fade-out="0.4"></audio>
      <audio id="sfx-end" class="clip" src="assets/sfx/chime.mp3" data-start="85.55" data-duration="2.54" data-track-index="3" data-volume="0.45"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Camera: every shot starts at 1.0 and drifts in slowly; each pause-trim join inside a shot
      // jumps the framing (1.0 <-> 1.07) so the cut reads as a deliberate punch-in, not a skip.
      const END = 88.6;
      const shots = [0, 2.8, 9.53, 15.33, 17.93, 21.47, 27.33, 31.47, 34.57, 36.94, 38.74, 42.23, 55.17, 61.13, 64.9, 71.13, 76.47, 79.8];
      const joins = [18.47, 22.43, 24.9, 28.07, 30.13, 35.37, 37.5, 44.7, 48.67, 52.6, 54.57, 56.93, 58.77, 63.43, 67.17, 69.63, 71.3, 74.4, 76.57, 83.0, 85.8];
      const marks = [...shots.map((t) => ({ t, shot: true })), ...joins.map((t) => ({ t, shot: false }))].sort((a, b) => a.t - b.t);
      let zoomed = false;
      marks.forEach((m, i) => {
        zoomed = m.shot ? false : !zoomed;
        const next = i + 1 < marks.length ? marks[i + 1].t : END;
        const base = zoomed ? 1.07 : 1.0;
        const d = next - m.t;
        tl.fromTo("#push", { scale: base }, { scale: base + Math.min(0.05, 0.012 * d), duration: d, ease: "none", immediateRender: i === 0 }, m.t);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

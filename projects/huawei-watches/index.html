<!doctype html>
<html lang="ar" dir="rtl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        background: #000;
      }
      #cam {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #push {
        position: absolute;
        inset: 0;
        transform-origin: 50% 46%;
      }
      #a-roll {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="92.36"
      data-width="1080"
      data-height="1920"
    >
      <div id="cam" data-layout-allow-overflow>
        <div id="push">
          <video
            id="a-roll"
            class="clip"
            src="assets/full.mp4"
            playsinline
            data-start="0"
            data-duration="92.36"
            data-track-index="0"
            data-has-audio="true"
          ></video>
        </div>
      </div>

      <!-- motion graphics, one scene per chapter -->
      <div id="hook" class="scene" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="13.867" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="kids" class="scene" data-composition-id="kids" data-composition-src="compositions/kids.html"
        data-start="13.867" data-duration="30.3" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="d3" class="scene" data-composition-id="d3" data-composition-src="compositions/d3.html"
        data-start="44.167" data-duration="23.466" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="gt7" class="scene" data-composition-id="gt7" data-composition-src="compositions/gt7.html"
        data-start="67.633" data-duration="15.7" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="outro" class="scene" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="83.333" data-duration="9.027" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <!-- captions rail -->
      <div id="captions" class="scene" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="92.36" data-track-index="2" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 3"></div>

      <!-- sound on the visible actions: kept soft, well under the voice -->
      <audio id="sfx-shutter" class="clip" src="assets/sfx/click.mp3" data-start="3.45" data-duration="0.36" data-track-index="3" data-volume="0.18"></audio>
      <audio id="sfx-inflate" class="clip" src="assets/sfx/whoosh.mp3" data-start="6.0" data-duration="0.57" data-track-index="3" data-volume="0.12"></audio>
      <audio id="sfx-tag1" class="clip" src="assets/sfx/pop.mp3" data-start="10.667" data-duration="0.72" data-track-index="3" data-volume="0.07"></audio>
      <audio id="sfx-tag2" class="clip" src="assets/sfx/pop.mp3" data-start="11.117" data-duration="0.72" data-track-index="4" data-volume="0.07"></audio>
      <audio id="sfx-tag3" class="clip" src="assets/sfx/pop.mp3" data-start="11.567" data-duration="0.72" data-track-index="3" data-volume="0.07"></audio>
      <audio id="sfx-ch1" class="clip" src="assets/sfx/whoosh.mp3" data-start="13.917" data-duration="0.57" data-track-index="3" data-volume="0.12"></audio>
      <audio id="sfx-cam" class="clip" src="assets/sfx/click.mp3" data-start="21.633" data-duration="0.36" data-track-index="3" data-volume="0.15"></audio>
      <audio id="sfx-sim" class="clip" src="assets/sfx/pop.mp3" data-start="23.433" data-duration="0.72" data-track-index="3" data-volume="0.07"></audio>
      <audio id="sfx-video" class="clip" src="assets/sfx/pop.mp3" data-start="26.017" data-duration="0.72" data-track-index="3" data-volume="0.07"></audio>
      <audio id="sfx-alert" class="clip" src="assets/sfx/notification.mp3" data-start="33.0" data-duration="1.6" data-track-index="3" data-volume="0.15"></audio>
      <audio id="sfx-link" class="clip" src="assets/sfx/ping.mp3" data-start="39.283" data-duration="1.3" data-track-index="3" data-volume="0.1"></audio>
      <audio id="sfx-ch2" class="clip" src="assets/sfx/whoosh.mp3" data-start="45.567" data-duration="0.57" data-track-index="3" data-volume="0.12"></audio>
      <audio id="sfx-badge" class="clip" src="assets/sfx/ping.mp3" data-start="48.167" data-duration="1.3" data-track-index="3" data-volume="0.09"></audio>
      <audio id="sfx-ch3" class="clip" src="assets/sfx/whoosh.mp3" data-start="67.683" data-duration="0.57" data-track-index="3" data-volume="0.12"></audio>
      <audio id="sfx-sparkle" class="clip" src="assets/sfx/sparkle.mp3" data-start="72.817" data-duration="1.8" data-track-index="3" data-volume="0.1"></audio>
      <audio id="sfx-ready" class="clip" src="assets/sfx/ping.mp3" data-start="77.4" data-duration="1.3" data-track-index="3" data-volume="0.09"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Camera: every shot starts at 1.0 and drifts in slowly; each pause-trim join inside a shot
      // jumps the framing (1.0 <-> 1.07) so the cut reads as a deliberate punch-in, not a skip.
      const END = 92.36;
      const shots = [0, 4.53, 9.9, 15.7, 18.3, 22.1, 28.3, 32.67, 35.77, 38.47, 40.37, 43.87, 57.47, 63.73, 67.63, 74.2, 79.8, 83.33];
      const joins = []; // nothing is cut: each shot just drifts in slowly
      const marks = [...shots.map((t) => ({ t, shot: true })), ...joins.map((t) => ({ t, shot: false }))].sort((a, b) => a.t - b.t);
      let zoomed = false;
      marks.forEach((m, i) => {
        zoomed = m.shot ? false : !zoomed;
        const next = i + 1 < marks.length ? marks[i + 1].t : END;
        const base = zoomed ? 1.07 : 1.0;
        const d = next - m.t;
        tl.fromTo("#push", { scale: base }, { scale: base + Math.min(0.05, 0.012 * d), duration: d, ease: "none", immediateRender: i === 0 }, m.t);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

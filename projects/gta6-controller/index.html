<!doctype html>
<html lang="ar" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        background: #000;
      }
      #cam {
        position: absolute;
        inset: 0;
        overflow: hidden;
        transform-origin: 50% 42%;
      }
      #a-roll {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #fx,
      #captions {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="56.08"
      data-width="1080"
      data-height="1920"
    >
      <div id="cam">
        <video
          id="a-roll"
          class="clip"
          src="assets/unbox.mp4"
          playsinline
          data-start="0"
          data-duration="56.08"
          data-track-index="0"
          data-has-audio="true"
        ></video>
      </div>
      <div
        id="fx"
        data-composition-id="fx"
        data-composition-src="compositions/fx.html"
        data-start="0"
        data-duration="56.08"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="56.08"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      // punch-ins on the spoken peaks (camera wrapper, not the timed video)
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.08, duration: 0.22, ease: "power3.out" }, 10.68); // فلكية
      tl.to("#cam", { scale: 1, duration: 0.45, ease: "power2.inOut" }, 11.18);
      tl.fromTo("#cam", { scale: 1 }, { immediateRender: false, scale: 1.1, duration: 0.22, ease: "power3.out" }, 16.56); // حقيقي؟
      tl.to("#cam", { scale: 1, duration: 0.45, ease: "power2.inOut" }, 17.16);
      tl.fromTo("#cam", { scale: 1 }, { immediateRender: false, scale: 1.07, duration: 0.22, ease: "power3.out" }, 28.25); // ما شاء الله
      tl.to("#cam", { scale: 1, duration: 0.45, ease: "power2.inOut" }, 29.85);
      tl.fromTo("#cam", { scale: 1 }, { immediateRender: false, scale: 1.08, duration: 0.22, ease: "power3.out" }, 32.54); // الكنترولر
      tl.to("#cam", { scale: 1, duration: 0.45, ease: "power2.inOut" }, 33.74);
      tl.fromTo("#cam", { scale: 1 }, { immediateRender: false, scale: 1.06, duration: 0.22, ease: "power3.out" }, 38.97); // الفخم
      tl.to("#cam", { scale: 1, duration: 0.45, ease: "power2.inOut" }, 39.47);
      tl.fromTo("#cam", { scale: 1 }, { immediateRender: false, scale: 1.08, duration: 0.22, ease: "power3.out" }, 44.12); // Grand Theft Auto
      tl.to("#cam", { scale: 1, duration: 0.45, ease: "power2.inOut" }, 45.32);
      tl.fromTo("#cam", { scale: 1 }, { immediateRender: false, scale: 1.06, duration: 0.22, ease: "power3.out" }, 53.84); // بالكومنتات
      tl.to("#cam", { scale: 1, duration: 0.45, ease: "power2.inOut" }, 54.64);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
